spring:
  application:
    name: checkpoint-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/checkpoint}
    username: ${DB_USER:checkpoint}
    password: ${DB_PASSWORD:checkpoint}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # Entities are only used inside service transactions; controllers return DTOs.
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8180}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

checkpoint:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4300}
  time-zone: America/Vancouver
  mail-from: ${MAIL_FROM:Checkpoint <no-reply@checkpoint.local>}
  # Secret key for hashing student card numbers. Must be set to a long random value in production.
  card-hash-key: ${CARD_HASH_KEY:dev-only-card-hash-key-change-me}
  bootstrap:
    club-name: ${BOOTSTRAP_CLUB_NAME:SFU Women in Computing Science}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:organizer@checkpoint.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:checkpoint-demo}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Demo Organizer}

springdoc:
  swagger-ui:
    csrf:
      enabled: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  # Email is best-effort (see EmailNotifier), so a mail server outage should not mark the API as down.
  health:
    mail:
      enabled: false
