# Serves the built Angular app and proxies /api to the backend, so the browser sees one origin.
# One origin means the session cookie and the CSRF cookie just work, with no CORS setup.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Ticket and booth links carry secrets in the URL: never send them to other sites as a referrer.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Note: an add_header inside a location replaces the server-level ones, so they are repeated below.

    location /api/ {
        proxy_pass http://api:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names, so they can be cached for a long time.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Every other path is an Angular route: serve index.html and let the router handle it.
    location / {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
