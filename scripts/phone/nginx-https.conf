# HTTPS in front of the web container, for testing on a phone over the local network.
# Phones only allow camera access on secure (HTTPS) pages. The certificate is self-signed and
# generated by scripts/phone-https.sh, so the phone shows a warning once that you accept.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/checkpoint-lan.crt;
    ssl_certificate_key /etc/nginx/certs/checkpoint-lan.key;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
